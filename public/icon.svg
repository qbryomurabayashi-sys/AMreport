<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="100" fill="#131e3d" />
    <!-- Gradient defs -->
    <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff176" />
            <stop offset="50%" stop-color="#ffb300" />
            <stop offset="100%" stop-color="#f57f17" />
        </linearGradient>
        <linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff8a80" />
            <stop offset="40%" stop-color="#d50000" />
            <stop offset="100%" stop-color="#8e0000" />
        </linearGradient>
        <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e0e0e0" />
            <stop offset="100%" stop-color="#757575" />
        </linearGradient>
    </defs>

    <circle cx="256" cy="256" r="230" fill="none" stroke="url(#gold)" stroke-width="12" />

    <!-- The gold crest part -->
    <g fill="url(#gold)" stroke="#aa6000" stroke-width="4">
        <!-- Roto Emblem styled wings sweeping up and down -->
        <path d="M 256 120 C 350 40, 480 60, 480 180 C 480 230, 400 240, 360 250 C 450 260, 500 340, 440 420 C 380 400, 320 340, 256 360 C 192 340, 132 400, 72 420 C 12 340, 62 260, 152 250 C 112 240, 32 230, 32 180 C 32 60, 162 40, 256 120 Z" />
        <!-- Lower tail shape -->
        <path d="M 256 370 L 320 450 L 256 420 L 192 450 Z" />
    </g>

    <!-- Sword -->
    <g fill="url(#silver)" stroke="#424242" stroke-width="2">
        <!-- Blade -->
        <path d="M 246 90 L 256 40 L 266 90 L 266 280 L 246 280 Z" />
        <!-- Crossguard -->
        <path d="M 210 280 L 302 280 L 302 296 C 280 292, 232 292, 210 296 Z" />
        <!-- Hilt -->
        <rect x="246" y="296" width="20" height="40" />
        <circle cx="256" cy="346" r="14" />
    </g>

    <!-- Ruby -->
    <circle cx="256" cy="288" r="14" fill="url(#ruby)" stroke="#420000" stroke-width="2" />
</svg>
